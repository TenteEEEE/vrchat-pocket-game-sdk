<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Pocket game player journey</title>
  <desc id="desc">Call a terminal at the world kiosk, pick it up and play, then return it to the pool or recall it.</desc>
  <rect width="1100" height="300" rx="24" fill="#101b2b"/>
  <text x="40" y="46" fill="#eaf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">ONE WORLD · PERSONAL GAMES</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(42 77)">
      <rect width="308" height="174" rx="18" fill="#1d3045" stroke="#43637d"/>
      <rect x="105" y="23" width="98" height="69" rx="7" fill="#10354b" stroke="#73d9d1" stroke-width="3"/>
      <rect x="91" y="94" width="126" height="13" rx="5" fill="#5f93a4"/>
      <text x="154" y="59" fill="#d0fff5" font-size="17" font-weight="700">KIOSK</text>
      <text x="154" y="135" fill="#ffffff" font-size="21" font-weight="700">1 · Call</text>
      <text x="154" y="158" fill="#b9cddd" font-size="15">Borrow a pooled terminal</text>
    </g>
    <g transform="translate(396 77)">
      <rect width="308" height="174" rx="18" fill="#1d3045" stroke="#43637d"/>
      <rect x="100" y="20" width="108" height="88" rx="12" fill="#66899e"/>
      <rect x="108" y="28" width="92" height="71" rx="6" fill="#142b41"/>
      <text x="154" y="72" fill="#ffdb80" font-size="28" font-weight="700">+1</text>
      <text x="154" y="135" fill="#ffffff" font-size="21" font-weight="700">2 · Play</text>
      <text x="154" y="158" fill="#b9cddd" font-size="15">Hold it; others can watch</text>
    </g>
    <g transform="translate(750 77)">
      <rect width="308" height="174" rx="18" fill="#1d3045" stroke="#43637d"/>
      <path d="M112 61h84m-20-20 20 20-20 20" fill="none" stroke="#73d9d1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="154" y="135" fill="#ffffff" font-size="21" font-weight="700">3 · Return / recall</text>
      <text x="154" y="158" fill="#b9cddd" font-size="15">Keep progress with your game ID</text>
    </g>
    <text x="373" y="173" fill="#73d9d1" font-size="37">→</text>
    <text x="727" y="173" fill="#73d9d1" font-size="37">→</text>
  </g>
</svg>
