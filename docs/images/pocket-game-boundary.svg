<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
  <title id="title">SDK and game responsibilities</title>
  <desc id="desc">The SDK owns terminal pooling, sessions and ownership, pickup input, and common UI. A game owns rules and content, spectator sync data, and PlayerData schema. The terminal session forwards events to the game.</desc>
  <rect width="1100" height="350" rx="24" fill="#101b2b"/>
  <g font-family="Arial,sans-serif">
    <text x="43" y="45" fill="#eaf3ff" font-size="23" font-weight="700">A REUSABLE TERMINAL, YOUR GAME INSIDE</text>
    <rect x="40" y="75" width="450" height="226" rx="18" fill="#123b4b" stroke="#71d6cf" stroke-width="2"/>
    <rect x="610" y="75" width="450" height="226" rx="18" fill="#4c3150" stroke="#ed9db4" stroke-width="2"/>
    <text x="66" y="113" fill="#9ef1e7" font-size="22" font-weight="700">SDK · shared terminal</text>
    <text x="636" y="113" fill="#ffc5d6" font-size="22" font-weight="700">YOUR GAME · unique play</text>
    <g fill="#eaf3ff" font-size="18">
      <text x="68" y="154">Kiosk and terminal pool</text>
      <text x="68" y="190">Session and ownership checks</text>
      <text x="68" y="226">Pickup input and return lifecycle</text>
      <text x="68" y="262">Screen shell, drawers and modal UI</text>
      <text x="638" y="154">Rules, actions and presentation</text>
      <text x="638" y="190">Spectator sync payload</text>
      <text x="638" y="226">PlayerData keys and save schema</text>
      <text x="638" y="262">Art, sound and game content</text>
    </g>
    <path d="M504 183h87m-15-15 15 15-15 15" fill="none" stroke="#f0d487" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="227" text-anchor="middle" fill="#f0d487" font-size="14">events</text>
  </g>
</svg>
